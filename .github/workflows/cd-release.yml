name: CD - Release

# Uploads the app files to Google Drive after "CI - E2E" passed on main.
# It runs only when the repository variable GDRIVE_FOLDER_ID is set.
# Setup: see "CD - Release" in AGENTS.md.

on:
  workflow_run:
    workflows: ["CI - E2E"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  # Needed to download the artifact of the "CI - E2E" run.
  actions: read

concurrency:
  group: cd-release
  cancel-in-progress: false

jobs:
  google-drive:
    name: Upload to Google Drive
    # Only after a successful push to main of this repository. Not for pull requests or forks.
    if: >-
      vars.GDRIVE_FOLDER_ID != '' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # The check waits up to 10 minutes for the other CI pipelines.
    timeout-minutes: 20
    steps:
      # Upload only the newest state of main, and only if all CI pipelines passed for it.
      # A re-run of an old run must not overwrite newer files.
      - name: Check that all CI pipelines passed for the newest commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main_sha=$(gh api "repos/${REPO}/commits/main" --jq .sha)
          if [ "$main_sha" != "$SHA" ]; then
            echo "::error::Commit ${SHA} is not the newest commit on main (${main_sha}). Nothing to upload."
            exit 1
          fi
          pipelines='["CI - Lint","CI - Format","CI - Typecheck","CI - Test","CI - E2E"]'
          for attempt in $(seq 1 30); do
            runs=$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&event=push&per_page=50" \
              --jq "[.workflow_runs[] | select(.name as \$n | ${pipelines} | index(\$n))] | group_by(.name) | map(max_by(.run_attempt))")
            count=$(echo "$runs" | jq length)
            pending=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
            failed=$(echo "$runs" | jq -r '[.[] | select(.status == "completed" and .conclusion != "success") | .name] | join(", ")')
            if [ -n "$failed" ]; then
              echo "::error::These CI pipelines did not pass: ${failed}"
              exit 1
            fi
            if [ "$count" -eq 5 ] && [ "$pending" -eq 0 ]; then
              echo "All 5 CI pipelines passed for ${SHA}."
              exit 0
            fi
            echo "Waiting for CI pipelines (${count}/5 found, ${pending} running) ..."
            sleep 20
          done
          echo "::error::The CI pipelines did not finish in time."
          exit 1

      # The files that "CI - E2E" built and tested. No new build.
      - name: Download tested release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Install rclone
        # Do not name these variables RCLONE_*: rclone reads every RCLONE_* variable as an option.
        env:
          RELEASE: v1.76.0
          SHA256: b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7
        run: |
          zip="rclone-${RELEASE}-linux-amd64.zip"
          curl -fsSLO "https://downloads.rclone.org/${RELEASE}/${zip}"
          echo "${SHA256}  ${zip}" | sha256sum --check --strict
          unzip -q "$zip"
          sudo install "rclone-${RELEASE}-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version

      # Only HTML files: the sync never touches data files (*.json) in the folder.
      # Scope drive.file: rclone sees only the files that it created itself.
      - name: Upload to Google Drive
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        run: |
          for name in TOKEN CLIENT_ID CLIENT_SECRET; do
            var="RCLONE_CONFIG_GDRIVE_${name}"
            if [ -z "${!var}" ]; then
              echo "::error::The secret GDRIVE_${name} is missing. Run 'pnpm setup:google-drive'. See 'CD - Release' in AGENTS.md."
              exit 1
            fi
          done
          rclone sync release/ gdrive: --include "*.html" --verbose
