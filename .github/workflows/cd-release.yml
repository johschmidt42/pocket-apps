name: CD - Release

# Publishes the app files on GitHub Pages after "CI - E2E" passed on main.
# It publishes exactly the files that "CI - E2E" built and tested.

on:
  workflow_run:
    workflows: ["CI - E2E"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  # Needed to download the artifact of the "CI - E2E" run.
  actions: read
  # Needed to publish on GitHub Pages.
  pages: write
  id-token: write

concurrency:
  group: cd-release
  cancel-in-progress: false

jobs:
  github-pages:
    name: Publish on GitHub Pages
    # Only after a successful push to main of this repository. Not for pull requests or forks.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # The check waits up to 10 minutes for the other CI pipelines.
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Publish only the newest state of main, and only if all CI pipelines passed for it.
      # A re-run of an old run must not overwrite newer files.
      - name: Check that all CI pipelines passed for the newest commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main_sha=$(gh api "repos/${REPO}/commits/main" --jq .sha)
          if [ "$main_sha" != "$SHA" ]; then
            echo "::error::Commit ${SHA} is not the newest commit on main (${main_sha}). Nothing to publish."
            exit 1
          fi
          pipelines='["CI - Lint","CI - Format","CI - Typecheck","CI - Test","CI - E2E"]'
          for attempt in $(seq 1 30); do
            runs=$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&event=push&per_page=50" \
              --jq "[.workflow_runs[] | select(.name as \$n | ${pipelines} | index(\$n))] | group_by(.name) | map(max_by(.run_attempt))")
            count=$(echo "$runs" | jq length)
            pending=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
            failed=$(echo "$runs" | jq -r '[.[] | select(.status == "completed" and .conclusion != "success") | .name] | join(", ")')
            if [ -n "$failed" ]; then
              echo "::error::These CI pipelines did not pass: ${failed}"
              exit 1
            fi
            if [ "$count" -eq 5 ] && [ "$pending" -eq 0 ]; then
              echo "All 5 CI pipelines passed for ${SHA}."
              exit 0
            fi
            echo "Waiting for CI pipelines (${count}/5 found, ${pending} running) ..."
            sleep 20
          done
          echo "::error::The CI pipelines did not finish in time."
          exit 1

      # The files that "CI - E2E" built and tested. No new build.
      - name: Download tested release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Prepare the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: release

      - name: Publish on GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
